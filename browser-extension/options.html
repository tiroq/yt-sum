<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>YT Sum Queue settings</title><link rel="stylesheet" href="options.css" /></head>
<body><main><h1>YT Sum Queue</h1><p>Configure the local YT Sum service used when you click the extension button.</p><form id="settings-form"><label>Service address<input id="service-url" type="url" required placeholder="http://127.0.0.1:8765" /></label><label>Bearer token<input id="authorization-token" type="password" autocomplete="off" placeholder="Optional" /></label><p class="hint">Only HTTP addresses on localhost or 127.0.0.1 are accepted. The token is optional.</p><button type="submit">Save settings</button><output id="status" aria-live="polite"></output></form></main><script type="module" src="options.js"></script></body></html>
